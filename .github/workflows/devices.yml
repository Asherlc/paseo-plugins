name: Devices CI

on:
  pull_request:
    paths:
      - 'plugins/devices/**'
      - 'shared/**'
      - '.github/workflows/devices.yml'
  push:
    branches: [main]
    tags: ['devices-v*']
    paths:
      - 'plugins/devices/**'
      - 'shared/**'
      - '.github/workflows/devices.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-devices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/devices/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: plugins/devices
      - run: npm run typecheck
        working-directory: plugins/devices
      - run: npm test
        working-directory: plugins/devices
      - run: npm pack --dry-run --ignore-scripts
        working-directory: plugins/devices

  marketplace:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/devices-v'))
    needs: check-devices
    runs-on: ubuntu-latest
    concurrency:
      group: devices-marketplace
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit this Devices revision to the Paseo marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          GH_REPO: getpaseo/plugins
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set the MARKETPLACE_TOKEN repository secret to a GitHub personal access token with public_repo scope. Then rerun failed jobs.'
            exit 1
          fi

          title="Devices $GITHUB_SHA marketplace update"
          existing=$(gh issue list --state all --search "$title in:title" \
            --json title,url --jq ".[] | select(.title == \"$title\") | .url")
          if [ -n "$existing" ]; then
            echo "Already submitted: $existing"
            exit 0
          fi

          # Compare against the most recently submitted Devices SHA for this repo.
          # A missing prior submission bootstraps; an empty diff skips.
          # shellcheck disable=SC2016 # $sha is jq syntax inside single quotes.
          submitted=$(gh issue list --state all \
            --search "sort:created-desc Devices marketplace update in:title" \
            --json title,body \
            --jq '
              first(
                .[]
                | . as $issue
                | ($issue.title | capture("^Devices (?<s>[0-9a-f]{40}) marketplace update$").s) as $sha
                | select(($issue.body | split("\n") | index("https://github.com/" + env.GITHUB_REPOSITORY + "/tree/" + $sha + "/plugins/devices")) != null)
                | $sha
              ) // empty
            ')
          if [ -n "$submitted" ]; then
            changed=$(git diff --name-only "$submitted" HEAD -- plugins/devices shared)
            if [ -z "$changed" ]; then
              echo "No Devices or shared changes since $submitted. Skipping marketplace submission."
              exit 0
            fi
          fi

          cat > "$RUNNER_TEMP/submission.md" <<EOF
          ### Source

          https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/plugins/devices

          ### Notes

          Submit this revision for the asherlc/devices listing.
          CI passed typechecking, tests, and the package dry run for this source revision.
          Upstream credit: Devices by Zed Obaia, MIT licensed, https://github.com/ZedObaia/paseo-plugins

          ### Categories

          - [x] Workspaces
          - [x] Utils
          EOF

          # Registry intake recognizes the Source section and adds its submission label.
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/submission.md"
